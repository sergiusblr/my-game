<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кого я уже пережил</title>
    <meta name="description" content="Сервис, который показывает известных людей, умерших в возрасте не больше вашего." />
    <link rel="preconnect" href="https://query.wikidata.org" crossorigin>
    <link rel="preconnect" href="https://ru.wikipedia.org" crossorigin>
    <link rel="preconnect" href="https://en.wikipedia.org" crossorigin>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <h1 id="app-title">Кого я уже пережил</h1>
        <p id="app-subtitle" class="subtitle">Узнайте, каких известных людей вы уже пережили по возрасту.</p>
      </div>
    </header>

    <main class="container">
      <section class="controls" aria-label="controls">
        <div class="control-row">
          <label class="sr-only" for="lang-select">Язык</label>
          <select id="lang-select" aria-label="Language">
            <option value="ru" selected>Русский</option>
            <option value="en">English</option>
          </select>

          <div class="input-group">
            <label for="dob" id="dob-label">Дата рождения</label>
            <input type="date" id="dob" placeholder="YYYY-MM-DD" />
          </div>

          <div class="input-group">
            <label for="age" id="age-label">Или возраст</label>
            <input type="number" id="age" inputmode="numeric" min="0" max="130" step="1" placeholder="Напр. 34" />
          </div>

          <button id="search-btn" class="btn primary">Показать</button>
        </div>
        <p id="helper-text" class="helper-text">Укажите дату рождения или возраст. Возраст имеет приоритет.</p>
      </section>

      <section class="stats" aria-live="polite">
        <div id="counter" class="counter">Вы пережили 0 известных людей</div>
      </section>

      <section class="grid-section">
        <div id="cards-grid" class="cards-grid" aria-live="polite" aria-busy="true">
          <!-- Skeleton placeholders -->
          <div class="card skeleton">
            <div class="thumb shimmer"></div>
            <div class="content">
              <div class="line shimmer w-70"></div>
              <div class="line shimmer w-40"></div>
              <div class="line shimmer w-90"></div>
              <div class="tags shimmer"></div>
            </div>
          </div>
          <div class="card skeleton">
            <div class="thumb shimmer"></div>
            <div class="content">
              <div class="line shimmer w-60"></div>
              <div class="line shimmer w-30"></div>
              <div class="line shimmer w-80"></div>
              <div class="tags shimmer"></div>
            </div>
          </div>
          <div class="card skeleton">
            <div class="thumb shimmer"></div>
            <div class="content">
              <div class="line shimmer w-50"></div>
              <div class="line shimmer w-40"></div>
              <div class="line shimmer w-60"></div>
              <div class="tags shimmer"></div>
            </div>
          </div>
          <div class="card skeleton">
            <div class="thumb shimmer"></div>
            <div class="content">
              <div class="line shimmer w-70"></div>
              <div class="line shimmer w-35"></div>
              <div class="line shimmer w-85"></div>
              <div class="tags shimmer"></div>
            </div>
          </div>
          <div class="card skeleton">
            <div class="thumb shimmer"></div>
            <div class="content">
              <div class="line shimmer w-60"></div>
              <div class="line shimmer w-40"></div>
              <div class="line shimmer w-70"></div>
              <div class="tags shimmer"></div>
            </div>
          </div>
          <div class="card skeleton">
            <div class="thumb shimmer"></div>
            <div class="content">
              <div class="line shimmer w-55"></div>
              <div class="line shimmer w-30"></div>
              <div class="line shimmer w-80"></div>
              <div class="tags shimmer"></div>
            </div>
          </div>
        </div>
        <div class="more-row">
          <button id="load-more" class="btn" hidden>Показать ещё</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p class="license" id="license-text">
          Данные: Wikidata (CC0), Wikipedia (CC BY-SA 3.0). Изображения: Wikimedia Commons.
        </p>
        <p class="source">
          <a href="https://www.wikidata.org" target="_blank" rel="noopener noreferrer">Wikidata</a>
          ·
          <a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipedia</a>
          ·
          <a href="https://commons.wikimedia.org" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>
        </p>
      </div>
    </footer>

    <script src="./app.js" defer></script>
  </body>
  </html>
